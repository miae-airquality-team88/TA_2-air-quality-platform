# =============================================================
#  Air Quality Platform - Infrastructure de base (Sprint 1)
#  Tickets Jira : AQ-6 (infrastructure), AQ-7 (services applicatifs), AQ-25 (Airflow)
#  Services : Kafka (mode KRaft, sans Zookeeper) + PostgreSQL
#             + Kafka UI (interface web pour visualiser Kafka)
# =============================================================
name: air-quality-platform

services:

  # -----------------------------------------------------------
  # Kafka en mode KRaft : un seul conteneur joue le rôle de
  # broker ET de controller -> pas besoin de Zookeeper (moins de RAM)
  # -----------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: aq-kafka
    ports:
      - "9092:9092"          # accès depuis Windows (scripts Python lancés hors Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 3 "portes" d'entrée :
      #  - PLAINTEXT      (kafka:29092)     -> pour les autres conteneurs
      #  - PLAINTEXT_HOST (localhost:9092)  -> pour ton PC Windows
      #  - CONTROLLER     (9093)            -> usage interne KRaft
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Un seul broker -> facteur de réplication = 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Les topics sont créés par un script versionné (ticket AQ-10),
      # pas automatiquement -> meilleure maîtrise (bonne pratique DataOps)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Limite la mémoire Java pour ménager le PC
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - airquality-net

  # -----------------------------------------------------------
  # PostgreSQL : stockage des mesures, agrégats et anomalies
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aq-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 côté Windows pour éviter un conflit avec un PostgreSQL local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data          # les données survivent au redémarrage
      - ./sql:/docker-entrypoint-initdb.d:ro      # scripts SQL exécutés au 1er démarrage (ticket AQ-12)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - airquality-net

  # -----------------------------------------------------------
  # Kafka UI : interface web pour voir topics et messages
  # http://localhost:8085
  # -----------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    container_name: aq-kafka-ui
    ports:
      - "8085:8080"          # 8085 car le port 8080 sera pris par Airflow plus tard
    environment:
      KAFKA_CLUSTERS_0_NAME: air-quality-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - airquality-net

  # -----------------------------------------------------------
  # Application Python (image construite depuis le Dockerfile, AQ-7)
  # Profil "app" : ces services ne démarrent PAS avec un simple
  # "docker compose up -d". Pour les lancer :
  #   docker compose --profile app up -d --build
  # -----------------------------------------------------------
  streaming:
    build: .
    image: air-quality-app:latest
    container_name: aq-streaming
    profiles: ["app"]
    command: ["sh", "-c", "python -m scripts.init_db && python -m streaming.consumer"]
    env_file: .env
    environment:          # dans le réseau Docker, les adresses changent
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - airquality-net

  simulator:
    build: .
    image: air-quality-app:latest
    container_name: aq-simulator
    profiles: ["app"]
    command: ["python", "-m", "ingestion.producer", "--sensors", "5", "--interval", "1"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      streaming:
        condition: service_started
    restart: unless-stopped
    networks:
      - airquality-net

  # -----------------------------------------------------------
  # Airflow (AQ-25) : orchestration du pipeline quotidien
  # Profil "airflow" : ne démarre que sur demande (économise la mémoire) :
  #   docker compose --profile airflow up -d --build
  # Interface : http://localhost:8080 (admin / mot de passe du .env)
  # -----------------------------------------------------------
  airflow:
    build: ./airflow
    image: air-quality-airflow:latest
    container_name: aq-airflow
    profiles: ["airflow"]
    command: ["bash", "/opt/aq/start.sh"]
    user: "50000:0"
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
      AIRFLOW__WEBSERVER__WORKERS: "2"
      CONNECTION_CHECK_MAX_COUNT: "0"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change_moi_aussi}
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      # Connexion « airquality_db » utilisée par les sensors SQL des DAGs
      AIRFLOW_CONN_AIRQUALITY_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Variables lues par common/config.py (le code du projet est monté dans /opt/airflow/project)
      PYTHONPATH: /opt/airflow/project
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Seuils des contrôles qualité (AQ-29), réglables dans le .env
      QUALITY_MIN_ROWS: ${QUALITY_MIN_ROWS:-100}
      QUALITY_MIN_COMPLETENESS: ${QUALITY_MIN_COMPLETENESS:-0.8}
      QUALITY_MAX_AGE_HOURS: ${QUALITY_MAX_AGE_HOURS:-26}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./common:/opt/airflow/project/common
      - ./orchestration:/opt/airflow/project/orchestration
      - ./streaming:/opt/airflow/project/streaming
      - ./scripts:/opt/airflow/project/scripts
      - ./schemas:/opt/airflow/project/schemas
      - ./sql:/opt/airflow/project/sql
      - ./data:/opt/airflow/project/data
      - ./models:/opt/airflow/project/models
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - airquality-net

volumes:
  pg_data:
  airflow_logs:

networks:
  airquality-net:
    name: airquality-net
