[tool.pytest.ini_options]
# Permet aux tests d'importer common/, ingestion/, scripts/ depuis la racine du dépôt
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
# Le dossier airflow/ du dépôt contient nos DAGs : ce n'est pas le package Airflow
known-third-party = ["airflow"]
